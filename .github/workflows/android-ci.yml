name: Windows development checks (not a release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows-preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Obtain pinned development source
        shell: pwsh
        working-directory: .
        run: |
          curl.exe -fL --retry 3 -o source.zip https://codeload.github.com/M-RTZ1/FoxyVPN/zip/cc2e169207d8866e92be20216dfed8069068d4de
          if ((Get-FileHash source.zip -Algorithm SHA256).Hash.ToLower() -ne '5fcb5d3dc0176290033424e5676f855b18fef74b1d992322bdca9cc6630069b7') { throw 'Source archive checksum mismatch' }
          Expand-Archive source.zip -DestinationPath source
          Move-Item source/FoxyVPN-cc2e169207d8866e92be20216dfed8069068d4de windows-preview
          Copy-Item windows-overrides/* windows-preview -Recurse -Force
          # Upstream omitted several vendored http2 files; fill only missing files
          # from the verified 2.3.1 archive, preserving the upstream patch.
          curl.exe -fL --retry 3 -o http2.tar.gz https://pub.dev/api/archives/http2-2.3.1.tar.gz
          if ((Get-FileHash http2.tar.gz -Algorithm SHA256).Hash.ToLower() -ne '382d3aefc5bd6dc68c6b892d7664f29b5beb3251611ae946a98d35158a82bbfa') { throw 'http2 archive checksum mismatch' }
          New-Item -ItemType Directory -Path http2-temp | Out-Null
          tar.exe -xzf http2.tar.gz -C http2-temp
          Get-ChildItem http2-temp/lib -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path http2-temp/lib).Path.Length).TrimStart('\')
            $destination = Join-Path 'windows-preview/third_party/http2/lib' $relative
            if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
              Copy-Item $_.FullName $destination
            }
          }
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze lib
      - name: Run simulated route, DNS and existing tests
        run: flutter test test/settings_mode_test.dart test/update_checker_test.dart test/h2_connection_window_test.dart test/browser_auth_test.dart test/route_manager_test.dart test/hev_config_test.dart test/system_proxy_manager_test.dart
      - run: flutter build windows --release
      - name: Package proxy-only unsigned preview with notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$release/SABI-FOX.exe")) { throw 'Application executable not found' }
          foreach ($f in @('hev-socks5-tunnel.exe','msys-2.0.dll','wintun.dll')) {
            if (Test-Path "$release/$f") { throw "Unexpected tunnel engine: $f" }
          }
          Copy-Item LICENSE "$release/UPSTREAM-LICENSE.txt"
          Copy-Item SABIFOX-WINDOWS-DEVELOPMENT.md "$release/READ-ME-FIRST.txt"
          Copy-Item third_party/http2/LICENSE "$release/HTTP2-LICENSE.txt"
          Copy-Item assets/fonts/OFL.txt "$release/FONTS-LICENSE.txt"
          Copy-Item assets/flags/LICENSE "$release/FLAGS-LICENSE.txt"
          Copy-Item pubspec.lock "$release/BUILD-PUBSPEC-LOCK.txt"
          Compress-Archive -Path "$release/*" -DestinationPath "$env:RUNNER_TEMP/SABI-FOX-Windows-BROWSER-AUTH-PREVIEW.zip"
          (Get-FileHash "$env:RUNNER_TEMP/SABI-FOX-Windows-BROWSER-AUTH-PREVIEW.zip" -Algorithm SHA256).Hash.ToLower() | Out-File "$env:RUNNER_TEMP/SHA256.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-browser-auth-unsigned-preview
          path: |
            ${{ runner.temp }}/SABI-FOX-Windows-BROWSER-AUTH-PREVIEW.zip
            ${{ runner.temp }}/SHA256.txt
          if-no-files-found: error
